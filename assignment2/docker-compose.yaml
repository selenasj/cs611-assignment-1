x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: SequentialExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__PARALLELISM: "1"
  AIRFLOW__WEBSERVER__SECRET_KEY: cs611-assignment2-local-demo
  PYTHONPATH: /opt/airflow/project
  MPLCONFIGDIR: /opt/airflow/project/reports/.mplconfig

x-airflow-volumes: &airflow-volumes
  - airflow_state:/opt/airflow/state
  - airflow_logs:/opt/airflow/logs
  - ./data:/opt/airflow/project/data:ro
  - ./datamart:/opt/airflow/project/datamart
  - ./model_bank:/opt/airflow/project/model_bank
  - ./reports:/opt/airflow/project/reports

services:
  airflow-init:
    build: .
    user: "0:0"
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes: *airflow-volumes
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/state /opt/airflow/logs && /entrypoint version && chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/state /opt/airflow/logs && echo 'Airflow UI: http://localhost:8080'"

  airflow-webserver:
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler

volumes:
  airflow_state:
  airflow_logs:
